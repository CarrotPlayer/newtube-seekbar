name: Nightly universal release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the nightly pre-release and upload its APK
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Keep the original code to make the nightly and original builds interchangeable
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # No lint here: it used to add 4+ minutes to every nightly for a pre-existing backlog
      # (764 errors at the time of writing) and never blocked anything. Run it locally or in a
      # separate pull-request workflow; this workflow exists to publish a build.
      #
      # With a signing key, build the release APK. Without one, build the DEBUG APK: Android
      # always signs debug builds (with the runner's debug key) and the .debug applicationId
      # suffix lets it install next to the official app, instead of publishing a release APK
      # with no certificate (which the package installer refuses).
      - name: Build with Gradle
        id: build
        run: |
          set -euo pipefail
          if [ "${HAS_SIGNING_KEY}" = "true" ]; then
            ./gradlew clean assembleStmobileRelease
            echo "apk_dir=stmobileRelease" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew clean assembleStmobileDebug
            echo "apk_dir=stmobileDebug" >> "$GITHUB_OUTPUT"
            echo "label= (debug-signed)" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # Never publish an APK the phone will refuse: this fails the run if the certificate is
      # missing (a misconfigured signing secret, say) instead of putting a broken file on the
      # Releases page.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=$(ls "smarttubetv/build/outputs/renamed_apks/${{ steps.build.outputs.apk_dir }}"/NewTube_*_universal.apk)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"

      # The universal APK is attached straight to a GitHub pre-release, so the Releases page is
      # the download. It carries every ABI, so it also installs on 32-bit phones where the
      # arm64-v8a split was refused. A workflow artifact would only wrap the APK in a ZIP.
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
          APK_DIR: ${{ steps.build.outputs.apk_dir }}
          LABEL: ${{ steps.build.outputs.label }}
          VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_RUN_NUMBER}"
          apk=$(ls "smarttubetv/build/outputs/renamed_apks/${APK_DIR}"/NewTube_*_universal.apk)
          echo "Publishing $apk as $tag"
          note_suffix=""
          if [ "${VARIANT}" = "debug" ]; then
            note_suffix=" Debug-signed build: it installs next to the official app as a separate .debug package. Add the SIGNING_KEY secret for a release-signed APK."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "NewTube ${VERSION_NAME}${LABEL}" \
              --notes "Automatic nightly build from commit ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}). Universal APK (all ABIs). This is a pre-release: it is not served to the in-app updater; the stable build is the latest published release.${note_suffix}"
          fi
          {
            echo "### Nightly pre-release"
            echo "[$tag](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"
