name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :smarttubetv:assembleStmobileDebug --no-daemon

      - name: Publish Universal APK to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find smarttubetv/build/outputs -name "*universal*.apk" -o -name "*Universal*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            # S'il n'y a pas "universal" explicite dans le nom, sélectionne l'APK le plus volumineux (qui embarque toutes les architectures)
            APK_FILE=$(find smarttubetv/build/outputs -name "*.apk" -type f -exec ls -S {} + | head -n 1)
          fi
          echo "APK sélectionné : $APK_FILE"

          # Nettoie l'ancien tag/release s'il existe déjà
          gh release delete v-debug --yes || true
          git tag -d v-debug || true
          git push origin :refs/tags/v-debug || true

          # Publie l'APK direct
          gh release create v-debug "$APK_FILE" \
            --title "NewTube Universal Debug" \
            --notes "APK Universal direct compatible tous processeurs (sans archive zip)."

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-Universal-Debug
          path: smarttubetv/build/outputs/apk/**/*.apk
