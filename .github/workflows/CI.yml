name: Nightly universal release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the nightly pre-release and upload its APK
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Keep the original code to make the nightly and original builds interchangeable
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # No lint here: it used to add 4+ minutes to every nightly for a pre-existing backlog
      # (764 errors at the time of writing) and never blocked anything. Run it locally or in a
      # separate pull-request workflow; this workflow exists to publish a build.
      - name: Build with Gradle
        run: ./gradlew clean assembleStmobileRelease

      # The universal APK is attached straight to a GitHub pre-release, so the Releases page is
      # the download. It carries every ABI, so it also installs on 32-bit phones where the
      # arm64-v8a split was refused. A workflow artifact would only wrap the APK in a ZIP.
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_RUN_NUMBER}"
          apk=$(ls smarttubetv/build/outputs/renamed_apks/stmobileRelease/NewTube_*_universal.apk)
          echo "Publishing $apk as $tag"
          if [ "${HAS_SIGNING_KEY}" != "true" ]; then
            echo "::warning::SIGNING_KEY is not set: this APK is unsigned and will not install on a normal phone."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "NewTube ${VERSION_NAME}" \
              --notes "Automatic nightly build from commit ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}). Universal APK (all ABIs). This is a pre-release: it is not served to the in-app updater; the stable build is the latest published release."
          fi
          {
            echo "### Nightly pre-release"
            echo "[$tag](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"
