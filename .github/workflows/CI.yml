name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :smarttubetv:assembleStmobileDebug --no-daemon

      - name: Isolate Universal APK
        run: |
          mkdir -p dist
          # Trouve l'APK universal ou le plus complet
          APK_FILE=$(find smarttubetv/build/outputs/apk -name "*universal*.apk" -o -name "*Universal*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find smarttubetv/build/outputs/apk -name "*.apk" -type f -exec ls -S {} + | head -n 1)
          fi
          cp "$APK_FILE" dist/NewTube-Universal.apk
          echo "APK isolé : dist/NewTube-Universal.apk"

      - name: Publish Direct APK to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v-debug --yes || true
          git tag -d v-debug || true
          git push origin :refs/tags/v-debug || true
          
          gh release create v-debug "dist/NewTube-Universal.apk" \
            --title "NewTube Universal Debug" \
            --notes "Fichier APK direct (Universal, taille réelle d'un seul build)."

      - name: Upload Single Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-Universal-Debug
          path: dist/NewTube-Universal.apk
